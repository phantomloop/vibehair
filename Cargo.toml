[package]
name = "vibehair"
version = "0.1.0"
edition = "2024"
description = "A minimalist crosshair game overlay for Windows and Linux."

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"

# Needed for the platform window handle behind the Windows click-through
# workaround; already in the tree via eframe on every platform.
[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "0.30", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
